name: pruebas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    name: pruebas
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar PyYAML
        run: pip install pyyaml
      - name: Compilar baton.py
        run: python -m py_compile skills/baton-setup/assets/baton.py
      - name: Prueba de punta a punta
        run: bash pruebas/e2e.sh
